<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="200" height="200">
<defs><radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#1a0533"/><stop offset="1" stop-color="#020024"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b2fff"/><stop offset=".5" stop-color="#ff00cc"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle cx="120" cy="120" r="112" fill="url(#bg)" stroke="url(#ring)" stroke-width="5" filter="url(#g)"/>
<g fill="#fff"><circle cx="48" cy="60" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="190" cy="50" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="200" cy="170" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="40" cy="170" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/></circle></g>
<ellipse cx="120" cy="120" rx="98" ry="30" fill="none" stroke="#00d4ff" stroke-opacity=".5" transform="rotate(-25 120 120)"/>
<circle r="5" fill="#00d4ff"><animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="8s" repeatCount="indefinite"/><animate attributeName="cx" values="120" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="22" dur="8s" repeatCount="indefinite"/></circle>
<text x="120" y="108" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="54" font-weight="700" fill="url(#ring)" filter="url(#g)">&lt;/&gt;</text>
